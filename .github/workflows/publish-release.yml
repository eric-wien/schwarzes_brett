name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  APP_ID: schwarzes_brett

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' appinfo/info.xml)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match info.xml version ${version}" >&2
            exit 1
          fi
          make verify-release

      - name: Build App Store archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          make appstore
          archive="$(make -s archive-path)"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "asset=$(basename "${archive}")" >> "${GITHUB_OUTPUT}"

      - name: Attach archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber

      - name: Publish archive to the Nextcloud App Store
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
          NIGHTLY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          key_file="${RUNNER_TEMP}/${APP_ID}.key"
          response_file="${RUNNER_TEMP}/appstore-response.txt"
          trap 'rm -f "${key_file}" "${response_file}"' EXIT
          printf '%s\n' "${APP_PRIVATE_KEY}" > "${key_file}"

          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET_NAME}"
          curl --fail --location --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors \
            --output /dev/null "${download_url}"

          signature="$(
            openssl dgst -sha512 -sign "${key_file}" \
              "${{ steps.package.outputs.archive }}" |
              openssl base64 -A
          )"
          payload="$(
            jq -n \
              --arg download "${download_url}" \
              --arg signature "${signature}" \
              --argjson nightly "${NIGHTLY}" \
              '{download: $download, signature: $signature, nightly: $nightly}'
          )"

          status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Token ${APPSTORE_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "${payload}" \
              https://apps.nextcloud.com/api/v1/apps/releases
          )"
          if [[ "${status}" != "200" && "${status}" != "201" ]]; then
            cat "${response_file}" >&2
            echo "App Store publication failed with HTTP ${status}" >&2
            exit 1
          fi
